name: Build Fusion+ DLL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Configurar entorno MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 👇 Compilamos el .vcxproj directamente, NO la .sln
      - name: Compilar el proyecto DLL en Release x64
        run: msbuild fusion-plus\fusion-plus.vcxproj /p:Configuration=Release /p:Platform=x64

      - name: Localizar el DLL generado
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Filter *.dll -Recurse | Select-Object FullName

      - name: Subir el artefacto (DLL)
        uses: actions/upload-artifact@v4
        with:
          name: fusion-plus-dll
          path: "**/*.dll"
          if-no-files-found: error
